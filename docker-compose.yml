services:
  gmail-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gmail-mcp
    restart: unless-stopped
    environment:
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      GMAIL_FROM_NAME: ${GMAIL_FROM_NAME:-JobSearcherBot}
      GMAIL_DEFAULT_TO: ${GMAIL_DEFAULT_TO:-${GMAIL_USER}}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      PORT: 8090
      MCP_PATH: /mcp
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8090)); s.close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
